[project]
name = "calendar-agent-backend"
version = "0.1.0"
description = "Privacy-minimized planning backend for the Mark-1 iOS app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.128.0",
  "google-genai>=1.55.0",
  "openai>=2.15.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.12.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19.0",
  "ruff>=0.14.0",
]
test = [
  "aiosqlite>=0.21.0",
  "httpx>=0.28.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 80
indent-width = 2
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*", "openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.api.*", "app.main"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
  "--cov=app",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
  "-q",
]

[tool.coverage.run]
branch = true
omit = ["app/models/*", "app/db/*"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
