services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calendar_agent
      POSTGRES_USER: calendar_agent
      POSTGRES_PASSWORD: calendar_agent
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - calendar-agent-postgres:/var/lib/postgresql/data

volumes:
  calendar-agent-postgres:
